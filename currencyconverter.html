<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Converter</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous" />
    <style>
        /* Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial, "Noto Sans", "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
        }

        /* Layout */
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f4e4ba;
            padding: 16px;
        }

        .container {
            background: #fff;
            width: min(420px, 92vw);
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 10px 24px rgba(0,0,0,0.08);
        }

        h2 {
            text-align: center;
            margin-bottom: 12px;
        }

        /* Form */
        form {
            margin: 20px 0 8px 0;
        }

        form select, form button, form input {
            width: 100%;
            border: none;
            outline: none;
            border-radius: 12px;
        }

        form input {
            border: 1px solid lightgray;
            font-size: 1rem;
            height: 48px;
            padding: 0 12px;
        }

        /* Dropdowns */
        .dropdown {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .dropdown i {
            font-size: 20px;
            margin-top: 10px;
        }

        .select-container {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 9rem;
            border-radius: 8px;
            border: 1px solid lightgray;
            padding: 6px 10px;
            background: #fafafa;
        }

        .select-container img {
            max-width: 2rem;
            height: 2rem;
            border-radius: 50%;
            object-fit: cover;
        }

        .select-container select {
            font-size: 1rem;
            width: auto;
            background: transparent;
        }

        /* Message + Button */
        .msg {
            margin: 20px 0;
            text-align: center;
            font-weight: 600;
        }

        form button {
            height: 48px;
            background-color: #af4d98;
            color: #fff;
            font-size: 1.05rem;
            cursor: pointer;
            transition: filter .2s ease;
        }

        form button:hover {
            filter: brightness(0.95);
        }

        /* Small screens */
        @media (max-width: 500px) {
            .dropdown {
                flex-direction: column;
                align-items: stretch;
            }
            
            .select-container {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Currency Converter</h2>
        <form>
            <div class="amount">
                <p>Enter Amount</p>
                <input value="100" type="number" min="1"/>
            </div>
            <div class="dropdown">
                <div class="from">
                    <p>From</p>
                    <div class="select-container">
                        <img src="https://flagsapi.com/US/flat/64.png" alt="USD flag"/>
                        <select name="from"></select>
                    </div>
                </div>
                <i class="fa-solid fa-right-left"></i>
                <div class="to">
                    <p>To</p>
                    <div class="select-container">
                        <img src="https://flagsapi.com/IN/flat/64.png" alt="INR flag"/>
                        <select name="to"></select>
                    </div>
                </div>
            </div>
            <div class="msg">1 USD = 80 INR</div>
            <button type="button">Get Exchange Rate</button>
        </form>
    </div>

    <script>
        // Minimal currency → country code map for flags
        const countryList = {
            USD: "US", INR: "IN", EUR: "EU", AUD: "AU", GBP: "GB",
            JPY: "JP", CAD: "CA", CHF: "CH", CNY: "CN", NZD: "NZ",
            SGD: "SG", ZAR: "ZA", AED: "AE", SAR: "SA", HKD: "HK",
            BRL: "BR", MXN: "MX", KRW: "KR", SEK: "SE", NOK: "NO",
            DKK: "DK", PLN: "PL", CZK: "CZ", HUF: "HU", RUB: "RU",
            THB: "TH", MYR: "MY", IDR: "ID", PHP: "PH", VND: "VN"
        };

        // DOM refs
        const dropdowns = document.querySelectorAll(".dropdown select");
        const btn = document.querySelector("form button");
        const fromCurr = document.querySelector(".from select");
        const toCurr = document.querySelector(".to select");
        const msg = document.querySelector(".msg");
        const amountInput = document.querySelector(".amount input");

        // Populate dropdowns
        for (const select of dropdowns) {
            select.innerHTML = "";
            for (const currCode in countryList) {
                const opt = document.createElement("option");
                opt.value = currCode;
                opt.textContent = currCode;
                select.appendChild(opt);
            }
        }

        // Set sensible defaults
        fromCurr.value = "USD";
        toCurr.value = "INR";

        // Flag updater
        function updateFlag(selectEl) {
            const currCode = selectEl.value;
            const countryCode = countryList[currCode];
            const img = selectEl.parentElement.querySelector("img");
            if (img && countryCode) {
                img.src = `https://flagsapi.com/${countryCode}/flat/64.png`;
                img.alt = `${currCode} flag`;
            }
        }

        // On dropdown change, update flags
        dropdowns.forEach((sel) =>
            sel.addEventListener("change", (e) => {
                updateFlag(e.target);
            })
        );

        // Initial flags
        updateFlag(fromCurr);
        updateFlag(toCurr);

        // Exchange rate fetcher using a working API
        async function updateExchangeRate() {
            let amtVal = parseFloat(amountInput.value);
            if (!amtVal || amtVal < 1) {
                amtVal = 1;
                amountInput.value = "1";
            }

            // Using ExchangeRate-API (free tier)
            const url = `https://api.exchangerate-api.com/v4/latest/${fromCurr.value}`;

            try {
                msg.textContent = "Loading...";
                const response = await fetch(url);
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                const rate = data.rates[toCurr.value];

                if (rate) {
                    const finalAmount = (amtVal * rate).toFixed(2);
                    msg.textContent = `${amtVal} ${fromCurr.value} = ${finalAmount} ${toCurr.value}`;
                } else {
                    throw new Error("Currency rate not found");
                }
            } catch (err) {
                console.error("Error fetching exchange rate:", err);
                msg.textContent = "Could not fetch exchange rate. Please try again.";
            }
        }

        // Button click → update
        btn.addEventListener("click", (e) => {
            e.preventDefault();
            updateExchangeRate();
        });

        // Run on load
        window.addEventListener("load", updateExchangeRate);

        // Add swap functionality
        document.querySelector(".fa-right-left").addEventListener("click", () => {
            const fromValue = fromCurr.value;
            const toValue = toCurr.value;
            
            fromCurr.value = toValue;
            toCurr.value = fromValue;
            
            updateFlag(fromCurr);
            updateFlag(toCurr);
            updateExchangeRate();
        });
    </script>
</body>
</html>
